  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ededed; /* Ice */
      color: #572c19; /* Brown Sugar */
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* Container de Estrelas Arrastáveis (Fica no topo absoluto de tudo) */
    #stars-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* Deixa o resto do site clicável */
      z-index: 9999; /* Garante que fique acima da foto e textos */
      overflow: hidden;
    }

    /* Estrelas Azuis Arrastáveis */
    .draggable-star {
      position: absolute;
      color: #98cdeb; /* Baby Blue */
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
      pointer-events: auto; /* Torna apenas a estrela clicável */
      touch-action: none;
      transition: color 0.2s ease, transform 0.1s ease;
      z-index: 9999;
    }

    .draggable-star:hover {
      color: #572c19;
    }

    .draggable-star.dragging {
      cursor: grabbing;
      color: #572c19;
      transform: scale(1.4);
      z-index: 100000 !important;
    }

    /* Faixa Superior Infinita (#98cdeb) */
    .top-ticker {
      background-color: #98cdeb;
      overflow: hidden;
      white-space: nowrap;
      padding: 6px 0;
      width: 100%;
      position: relative;
      z-index: 200;
    }

    .ticker-track {
      display: flex;
      width: max-content;
      animation: marquee 25s linear infinite;
    }

    .ticker-content {
      display: flex;
      gap: 20px;
      padding-right: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #160a05;
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Layout Principal da Home (PC) */
    .main-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 60px 20px;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 60px;
      align-items: flex-start;
      position: relative;
      z-index: 10;
    }

    /* Coluna Esquerda: Logo, Texto, Projetos */
    .left-side {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding-top: 50px;
      position: relative;
      z-index: 20;
    }

    .logo-img {
      width: 180px;
      height: auto;
      margin-bottom: 35px;
      display: block;
      user-select: none;
    }

    .bio-text p {
      font-size: 0.95rem;
      color: #572c19;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .projects-link-img {
      display: inline-block;
      margin-top: 25px;
      transition: transform 0.2s ease, opacity 0.2s ease;
      position: relative;
      z-index: 50;
      cursor: pointer;
    }

    .projects-link-img img {
      width: 180px;
      height: auto;
      display: block;
      user-select: none;
    }

    .projects-link-img:hover {
      transform: scale(1.05);
      opacity: 0.85;
    }

    /* Coluna Direita: Redes + Foto com Estrelas Marrons Fixas */
    .right-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      width: 100%;
      position: relative;
      z-index: 20;
    }

    .social-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      width: 100%;
      margin-bottom: 25px;
      position: relative;
      z-index: 50;
    }

    .social-bar a {
      color: #572c19;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.2s;
    }

    .social-bar a:hover {
      opacity: 0.7;
    }

    .social-bar svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .btn-budget {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid #572c19;
      padding: 6px 16px;
      border-radius: 20px;
      line-height: 1;
    }

    .btn-budget svg {
      width: 18px;
      height: 18px;
    }

    .photo-wrapper {
      position: relative;
      width: 100%;
      max-width: 380px;
      z-index: 10;
    }

    .profile-photo {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(22, 10, 5, 0.08);
      user-select: none;
      position: relative;
      z-index: 10;
    }
