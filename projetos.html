<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projetos — agos dsgn</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f2f3f7;
      color: #3a1c18;
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Faixa Superior */
    .top-ticker {
      background-color: #b0cbe8;
      overflow: hidden;
      white-space: nowrap;
      padding: 6px 0;
      display: flex;
      width: 100%;
    }

    .ticker-track {
      display: flex;
      width: max-content;
      animation: marquee 25s linear infinite;
    }

    .ticker-content {
      display: flex;
      gap: 20px;
      padding-right: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #3a1c18;
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Container Principal */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px 60px 20px;
    }

    .back-link {
      display: inline-block;
      color: #3a1c18;
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 25px;
      transition: opacity 0.2s;
    }

    .back-link:hover {
      opacity: 0.7;
    }

    /* Grid dos Projetos */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
    }

    /* Card Clicável Estilo Exposição Behance */
    .behance-scroll-card {
      display: block;
      text-decoration: none;
      height: 380px;
      overflow-y: auto;
      scroll-behavior: smooth;
      border-radius: 16px;
      background-color: #f7f5ed;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }

    .behance-scroll-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    /* Barra de rolagem discreta */
    .behance-scroll-card::-webkit-scrollbar {
      width: 6px;
    }
    .behance-scroll-card::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.03);
    }
    .behance-scroll-card::-webkit-scrollbar-thumb {
      background: rgba(58, 28, 24, 0.2);
      border-radius: 10px;
    }
    .behance-scroll-card::-webkit-scrollbar-thumb:hover {
      background: rgba(58, 28, 24, 0.4);
    }

    .behance-scroll-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Responsivo */
    @media (max-width: 768px) {
      .projects-grid {
        grid-template-columns: 1fr;
      }
      .behance-scroll-card {
        height: 320px;
      }
    }
  </style>
</head>
<body>
